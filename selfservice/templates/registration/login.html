{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card login">
  <h2>Sign in</h2>
  {% if form.errors %}<p class="errorlist">Wrong user name or password.</p>{% endif %}
  <form method="post" class="f">{% csrf_token %}
    <p><label for="id_username">User name</label>{{ form.username }}</p>
    <p><label for="id_password">Password</label>{{ form.password }}</p>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn">Sign in</button>
  </form>
  <p class="small mute" style="margin-top:14px">Accounts are made in the admin by an operator.</p>
</div>
{% endblock %}
