# evpn-3tier: an EVPN/VXLAN leaf-spine fabric (VyOS) carrying a three-tier web application (Alpine), every node a
# libvirt/KVM VM. Two spines, four leaves in two racks, two border leaves. Off the borders: a VyOS firewall pair (the
# only path between the tiers' VRFs), an HAProxy load-balancer pair (the web tier only) and `wan`, one VyOS VM that
# stands in for the WAN / internet. Each rack holds one web, one app and one db server, each dual-homed to the rack's
# leaf pair (an LACP bond = an EVPN Ethernet Segment); the firewalls and load balancers are dual-homed to the borders.
# Underlay: eBGP over unnumbered IPv6 link-local links, BFD. Overlay: BGP EVPN, a VRF + L3VNI per tier (symmetric IRB),
# anycast gateways, explicit route targets. lab.conf is the source of truth: `lab.sh gen` renders every config from it.
LAB_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
LIBVIRT_URI="qemu:///system"
LAB_NAME="evpn-3tier"
DOMAIN_PREFIX="e3t-"          # libvirt domain names are host-wide: every VM of this lab is e3t-<node>

# VyOS base image (built once from the rolling ISO by ../cat8000v-ipsec/tools/vyos_install.py); every VyOS node is an overlay on it.
VYOS_IMAGE="/home/dcantor/cat8000v-ipsec/images/vyos-base.qcow2"
VYOS_VCPU=1
VYOS_RAM_MIB=1024
VYOS_CPU_SHARES=400           # routers first when the host is busy: a starved single-vCPU router drops its BFD sessions
# Linux VMs: tools/build_image.sh's Alpine image (haproxy, keepalived, nginx, python3 + psycopg, PostgreSQL 17 pre-installed)
LINUX_IMAGE="$LAB_DIR/images/e3t-alpine.qcow2"
declare -A LINUX_RAM_MIB=( [lb]=256 [web]=256 [app]=256 [db]=512 )

# Out-of-band management (isolated libvirt bridge; the host is the gateway). eth0 on every VM.
OOB_NET="e3t-oob"
OOB_GATEWAY="10.18.0.1"
NMS_IP=""                     # the shared NMS's NIC on this OOB network: none yet (phase 5); empty = no monitoring config

# ---- the nodes --------------------------------------------------------------------------------------------------------
SPINES=(spine1 spine2)
LEAVES=(leaf1 leaf2 leaf3 leaf4)
BORDERS=(border1 border2)
FIREWALLS=(fw1 fw2)
WANS=(wan)
LBS=(lb1 lb2)
SERVERS=(web1 web2 app1 app2 db1 db2)
ROUTERS=("${SPINES[@]}" "${LEAVES[@]}" "${BORDERS[@]}" "${FIREWALLS[@]}" "${WANS[@]}")
LINUX=("${LBS[@]}" "${SERVERS[@]}")
ALL_NODES=("${ROUTERS[@]}" "${LINUX[@]}")

declare -A ROLE=(     [spine1]=spine [spine2]=spine [leaf1]=leaf [leaf2]=leaf [leaf3]=leaf [leaf4]=leaf
                      [border1]=border [border2]=border [fw1]=fw [fw2]=fw [wan]=wan
                      [lb1]=lb [lb2]=lb [web1]=web [web2]=web [app1]=app [app2]=app [db1]=db [db2]=db )
declare -A NODE_IDX=( [spine1]=1 [spine2]=2 [leaf1]=3 [leaf2]=4 [leaf3]=5 [leaf4]=6 [border1]=7 [border2]=8
                      [fw1]=9 [fw2]=10 [wan]=11 [lb1]=12 [lb2]=13 [web1]=14 [web2]=15 [app1]=16 [app2]=17 [db1]=18 [db2]=19 )
declare -A MGMT_IP=(  [spine1]=10.18.0.11 [spine2]=10.18.0.12
                      [leaf1]=10.18.0.21 [leaf2]=10.18.0.22 [leaf3]=10.18.0.23 [leaf4]=10.18.0.24
                      [border1]=10.18.0.31 [border2]=10.18.0.32 [fw1]=10.18.0.41 [fw2]=10.18.0.42 [wan]=10.18.0.45
                      [lb1]=10.18.0.51 [lb2]=10.18.0.52 [web1]=10.18.0.61 [web2]=10.18.0.62
                      [app1]=10.18.0.71 [app2]=10.18.0.72 [db1]=10.18.0.81 [db2]=10.18.0.82 )
# loopback = router-id = VXLAN tunnel endpoint (VTEP) on the fabric nodes
declare -A LOOPBACK=( [spine1]=10.61.0.1 [spine2]=10.61.0.2
                      [leaf1]=10.61.0.11 [leaf2]=10.61.0.12 [leaf3]=10.61.0.13 [leaf4]=10.61.0.14
                      [border1]=10.61.0.21 [border2]=10.61.0.22 [fw1]=10.61.0.31 [fw2]=10.61.0.32 [wan]=10.61.0.41 )
declare -A BGP_AS=(   [spine1]=65100 [spine2]=65100 [leaf1]=65101 [leaf2]=65102 [leaf3]=65103 [leaf4]=65104
                      [border1]=65121 [border2]=65122 [fw1]=65200 [fw2]=65200 [wan]=65000 )
declare -A RACK=(     [spine1]=spine [spine2]=spine [leaf1]=rack1 [leaf2]=rack1 [leaf3]=rack2 [leaf4]=rack2
                      [border1]=border [border2]=border [fw1]=edge [fw2]=edge [wan]=wan [lb1]=edge [lb2]=edge
                      [web1]=rack1 [app1]=rack1 [db1]=rack1 [web2]=rack2 [app2]=rack2 [db2]=rack2 )
declare -A CONSOLE_PORT=()
for _n in "${ALL_NODES[@]}"; do CONSOLE_PORT[$_n]=$(( 5620 + NODE_IDX[$_n] )); done; unset _n   # 5621-5639

# ports per role (eth0 is always the OOB NIC)
declare -A ROLE_PORTS=(
  [spine]=6       # eth1..4 leaf1..4, eth5..6 border1..2
  [leaf]=5        # eth1 spine1, eth2 spine2, eth3 web, eth4 app, eth5 db (each a leg of that server's bond)
  [border]=7      # eth1 spine1, eth2 spine2, eth3 fw1, eth4 fw2, eth5 lb1, eth6 lb2 (bond legs), eth7 wan
  [fw]=3          # eth1 border1, eth2 border2 (one LACP bond, a trunk of the transit VLANs), eth3 the state-sync link
  [wan]=2         # eth1 border1, eth2 border2; eth3 = the NAT uplink (NET_PORT)
  [lb]=2 [web]=2 [app]=2 [db]=2   # eth1 + eth2 = the bond to a leaf / border pair
)
declare -A NET_PORT=( [wan]="3:default" )   # wan eth3 on libvirt's NAT network: the real internet behind "the internet"

# ---- the wiring ---------------------------------------------------------------------------------------------------------
# "nodeA:port nodeB:port kind" — kind: fabric (unnumbered eBGP, MTU 9000), access (a bond leg of an Ethernet Segment),
# wan (a routed /31, border <-> wan, in VRF outside), sync (fw1 <-> fw2, conntrack sync)
LINKS=(
  "spine1:1 leaf1:1 fabric"   "spine1:2 leaf2:1 fabric"   "spine1:3 leaf3:1 fabric"   "spine1:4 leaf4:1 fabric"
  "spine1:5 border1:1 fabric" "spine1:6 border2:1 fabric"
  "spine2:1 leaf1:2 fabric"   "spine2:2 leaf2:2 fabric"   "spine2:3 leaf3:2 fabric"   "spine2:4 leaf4:2 fabric"
  "spine2:5 border1:2 fabric" "spine2:6 border2:2 fabric"
  "leaf1:3 web1:1 access"     "leaf2:3 web1:2 access"
  "leaf1:4 app1:1 access"     "leaf2:4 app1:2 access"
  "leaf1:5 db1:1 access"      "leaf2:5 db1:2 access"
  "leaf3:3 web2:1 access"     "leaf4:3 web2:2 access"
  "leaf3:4 app2:1 access"     "leaf4:4 app2:2 access"
  "leaf3:5 db2:1 access"      "leaf4:5 db2:2 access"
  "border1:3 fw1:1 access"    "border2:3 fw1:2 access"
  "border1:4 fw2:1 access"    "border2:4 fw2:2 access"
  "border1:5 lb1:1 access"    "border2:5 lb1:2 access"
  "border1:6 lb2:1 access"    "border2:6 lb2:2 access"
  "border1:7 wan:1 wan"       "border2:7 wan:2 wan"
  "fw1:3 fw2:3 sync"
)
FABRIC_MTU=9000
MAX_PATHS=4                # eBGP ECMP across the spines
VRF_MAX_PATHS=32           # ECMP in the VRFs counts BGP paths (each type-5 route arrives once per spine)

# ---- the overlay: one VRF (+ L3VNI) per tier, plus `outside` (borders only: wan and the firewalls' outside leg) -------
# Route targets are explicit and the same everywhere: RT_AS:<VNI>. The VRFs share no route target: nothing leaks between
# them in the fabric; the firewalls are the only path (each VRF's default route points at them).
EVPN_RT_AS=65500
ANYCAST_MAC="00:00:5e:00:01:01"
VRFS=(web app db outside)
declare -A VRF_TABLE=( [web]=1010  [app]=1020  [db]=1030  [outside]=1099 )
declare -A VRF_L3VNI=( [web]=50010 [app]=50020 [db]=50030 [outside]=50099 )
declare -A VRF_L3VLAN=([web]=4010  [app]=4020  [db]=4030  [outside]=4090 )      # the bridge VLAN the L3VNI rides on (802.1Q: 1-4094)
declare -A VRF_PROBE=( [web]=10.255.10 [app]=10.255.20 [db]=10.255.30 [outside]=10.255.99 )   # VTEP probe <prefix>.<lo last octet>/32
# The tier VLANs: "vlan vrf l2vni anycast-gateway/len where" — where = leaves | leaves+borders (the load balancers hang
# off the borders in the web VLAN, so the borders carry it and its gateway too). A leaf's own address in a VLAN is
# .<SVI_HOST_BASE + leaf n>, a border's .<SVI_BORDER_BASE + border n>.
VLANS=(
  "10 web 10010 172.16.10.1/24 leaves+borders"
  "20 app 10020 172.16.20.1/24 leaves"
  "30 db  10030 172.16.30.1/24 leaves"
)
SVI_HOST_BASE=240          # leaf1 .241 ... leaf4 .244
SVI_BORDER_BASE=250        # border1 .251, border2 .252
# The firewalls' transit VLANs (borders only, L2VNI between the two borders): "vlan vrf l2vni subnet". In each, the
# borders (.2 / .3) peer eBGP with fw1 (.11) and fw2 (.12); fw1 is preferred (fw2 prepends), so every flow between
# VRFs crosses fw1 in both directions while it lives.
TRANSIT=(
  "110 web     10110 172.16.110.0/28"
  "120 app     10120 172.16.120.0/28"
  "130 db      10130 172.16.130.0/28"
  "199 outside 10199 172.16.199.0/28"
)
# border n <-> wan: 172.31.<n>.0/31 (border .0, wan .1) in VRF outside; fw1 <-> fw2 sync: 172.31.255.0/31
WAN_PREFIX="172.31"
WAN_CLIENTS="198.51.100.0/24"     # "the internet's" test clients, on wan
SYNC_NET="172.31.255.0/31"

# ---- the Linux VMs: each sits in one VLAN (its tier), on an LACP bond to a leaf pair (servers) or the border pair (lbs) --
# "node vlan hostnum es" — address .<hostnum> in the VLAN, default route via its anycast gateway
LINUX_NET=(
  "lb1  10 5  13"   "lb2  10 6  14"
  "web1 10 11 1"    "web2 10 12 4"
  "app1 20 11 2"    "app2 20 12 5"
  "db1  30 11 3"    "db2  30 12 6"
)
declare -A FW_ES=( [fw1]=11 [fw2]=12 )   # the firewalls' bonds to the borders are Ethernet Segments too
WEB_VIP="172.16.10.10"          # keepalived on lb1 / lb2 (VRRP), HAProxy behind it (phase 3)
ES_SYS_MAC_PREFIX="02:00:00:00:e3"   # ES n -> 02:00:00:00:e3:<n hex>
ES_DF_PREF=(200 100)                 # DF preference: first leaf / border of the pair, second

# MACs 52:54:00:d0:<idx>:<port> (hex); evpn-fabric :ca, ... tcp-cc-lab :ce
MAC_OUI="52:54:00:d0"
# UDP ports 34000 + idx*100 + port, far side +10000 (34000-35999 / 44000-45999): clear of every other lab's range
UDP_BASE=34000
